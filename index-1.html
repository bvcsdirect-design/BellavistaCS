<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellavista Cabinet Supply</title>
<meta name="description" content="Choose your Bellavista Cabinet Supply location: Chicago or Miami.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf7f2;--cream-2:#f2ece2;--ink:#1a1816;--crimson:#a3212b;--burgundy:#6e0f17}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 0,#fff,var(--cream) 55%,var(--cream-2));color:var(--ink);font-family:Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
.box{width:100%;max-width:420px;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mono{font-family:'Pinyon Script',cursive;font-size:64px;color:var(--crimson);line-height:1}
h1{font-family:'Playfair Display',serif;font-weight:500;font-size:30px;margin:6px 0 4px}
.sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#6b645c}
.rule{width:48px;height:2px;background:var(--crimson);margin:22px auto}
p{font-size:14px;color:#4a443d;margin-bottom:22px}
a.btn{display:block;padding:18px 20px;margin-bottom:12px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;transition:.3s}
a.s{background:linear-gradient(135deg,var(--crimson),var(--burgundy));color:#fff;box-shadow:0 10px 24px -10px rgba(110,15,23,.6)}
a.o{border:1.5px solid var(--crimson);color:var(--crimson);background:rgba(255,255,255,.5)}
a.btn:hover{transform:translateY(-2px)}
a.btn small{display:block;margin-top:4px;font-size:10px;letter-spacing:.14em;opacity:.8;font-weight:500}
</style></head><body>
<div class="box">
<div class="mono">B</div>
<h1>Bellavista</h1><div class="sub">Cabinet Supply</div>
<div class="rule"></div>
<p>Choose your location to browse our cabinet doors.</p>
<a class="btn s" href="chicago.html">Main · Chicago<small>Browse all colors</small></a>
<a class="btn o" href="miami.html">Miami<small>Browse Miami colors</small></a>
</div></body></html>
