<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellavista Cabinet Supply</title>
<meta name="description" content="Choose your Bellavista Cabinet Supply location: Chicago or Miami.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4eee3;--cream-2:#ebe3d4;--ink:#1a1816;--ink-2:#5a534c;--crimson:#7a1f2e;--burgundy:#4f1220;--line:rgba(79,18,32,.18)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;padding:28px 16px 48px;text-align:center;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:880px;margin:0 auto;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{width:min(300px,70%);height:auto;display:block;margin:0 auto 22px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(32px,6vw,56px);line-height:1.1;color:var(--burgundy);max-width:680px;margin:0 auto 12px}
h1 em{color:var(--crimson)}
.sub{max-width:520px;margin:0 auto 26px;color:var(--ink-2);font-size:15px;line-height:1.6}
.frame{background:#fbf8f1;padding:10px;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 44px -26px rgba(79,18,32,.45);margin:0 auto 28px}
.frame img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--cream-2)}
.btns{display:grid;gap:12px;grid-template-columns:1fr;max-width:640px;margin:0 auto}
@media(min-width:620px){.btns{grid-template-columns:1fr 1fr}}
a.btn{display:block;padding:18px 20px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;transition:transform .3s,background .3s}
a.s{background:var(--crimson);color:#fff}
a.o{border:1.5px solid var(--crimson);color:var(--crimson)}
a.btn:hover{transform:translateY(-2px)}
a.s:hover{background:var(--burgundy)}
a.btn small{display:block;margin-top:4px;font-size:10px;letter-spacing:.14em;opacity:.85;font-weight:500}
.foot{margin-top:30px;font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.foot a{color:var(--crimson);text-decoration:none}
</style></head><body>
<div class="box">
<img class="logo" src="logo.png" alt="Bellavista Cabinet Supply">
<h1>Welcome to <em>Bellavista.</em></h1>
<p class="sub">Cabinet doors for kitchens you will love. Choose your location to begin.</p>
<div class="frame"><img src="https://drive.google.com/thumbnail?id=1S2e2kF0tRHvYqfHbtVcpHIIZOpYK7QKu&amp;sz=w1600" alt="A finished kitchen with Bellavista cabinets"></div>
<div class="btns">
<a class="btn s" href="chicago.html">Main · Chicago<small>Browse all colors</small></a>
<a class="btn o" href="miami.html">Miami<small>Browse Miami colors</small></a>
</div>
<p class="foot">Chicago <a href="tel:+17737267752">773-726-7752</a> · Miami <a href="tel:+17867080472">786-708-0472</a></p>
</div></body></html>
